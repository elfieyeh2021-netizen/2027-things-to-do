<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f1e9">
<title>2027｜想做的事</title>
<style>
:root{--bg:#f4f1e9;--paper:#fffdf8;--ink:#28332e;--muted:#788078;--line:#e4e2d8;--green:#647d6b;--pale:#e8eee6;--orange:#c58b62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:1060px;margin:auto;padding:42px 24px 70px}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.hero{padding:58px 0 38px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}
h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(48px,8vw,82px);line-height:1.08;font-weight:500;letter-spacing:-.04em;margin:14px 0}
h1 span{color:var(--green);font-style:italic}
.lead{max-width:500px;color:var(--muted);font-size:15px}
.note{border-left:1px solid #b8c5b8;padding:5px 0 5px 20px;color:#69756b;font-family:Georgia,"Noto Serif TC",serif;font-size:18px}
.stats{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 25px;margin:12px 0 30px;display:grid;grid-template-columns:150px 1fr 90px;gap:22px;align-items:center}
.stat-number{font:42px Georgia,serif}.stat-label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.progress-track{height:7px;background:#ecebe4;border-radius:20px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;width:0;background:var(--green);transition:width .25s}
.percent{text-align:right;font:28px Georgia,serif}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:28px 0 18px;flex-wrap:wrap}
.filters{display:flex;gap:7px;flex-wrap:wrap}
button,input{font:inherit}button{cursor:pointer}
.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:30px;font-size:12px}
.filter.active{background:var(--ink);color:white;border-color:var(--ink)}
.add{background:var(--green);color:white;border:0;border-radius:30px;padding:10px 17px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.category{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 21px;min-width:0}
.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.cat-title{font-size:15px;font-weight:700}.cat-en{font:italic 12px Georgia,serif;color:#92998f;margin-left:7px}
.cat-count{font-size:11px;color:var(--muted)}
.items{display:grid;gap:2px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0efe9;font-size:13px}
.item:last-child{border-bottom:0}
.item input{appearance:none;width:16px;height:16px;border:1px solid #c5c9bf;border-radius:4px;margin:3px 0 0;flex:none;cursor:pointer}
.item input:checked{background:var(--green);border-color:var(--green)}
.item input:checked:after{content:"✓";display:block;color:white;font-size:12px;text-align:center;line-height:14px}
.item.done .item-text{text-decoration:line-through;color:#a1a69e}
.item-text{flex:1;overflow-wrap:anywhere}
.delete{border:0;background:none;color:#b6b8b0;padding:0 3px;font-size:17px;line-height:1}
.delete:hover{color:#a45e4c}
.add-row{display:flex;gap:7px;margin-top:13px}
.add-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fffefa;font-size:12px;outline:none}
.add-row input:focus{border-color:var(--green)}
.add-row button{border:1px solid var(--line);background:#f6f6f0;border-radius:8px;padding:7px 11px;font-size:12px;color:var(--green)}
.footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.reset{border:0;background:none;color:#9a7666;text-decoration:underline;font-size:11px}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}
@media(max-width:700px){.wrap{padding:25px 16px 50px}.hero{grid-template-columns:1fr;padding:42px 0 25px;gap:15px}.note{font-size:16px}.stats{grid-template-columns:90px 1fr;gap:12px;padding:17px}.percent{grid-column:1/-1;text-align:left;font-size:21px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.topline{font-size:10px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="topline"><span>PERSONAL YEARBOOK</span><span>JAN — DEC / 2027</span></div>
  <section class="hero">
    <div><div class="eyebrow">A YEAR TO EXPLORE</div><h1>2027 <span>想做的事</span></h1><p class="lead">把想去的地方、想學的技能、想完成的小事都放進來。慢慢勾選，讓這一年留下自己的軌跡。</p></div>
    <div class="note">“Make room for the things<br>you want to remember.”</div>
  </section>
  <section class="stats">
    <div><div class="stat-number" id="doneCount">0</div><div class="stat-label">已完成項目</div></div>
    <div><div class="stat-label">2027 PROGRESS</div><div class="progress-track"><div class="progress-fill" id="progress"></div></div></div>
    <div class="percent" id="percent">0%</div>
  </section>
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="open">待完成</button>
      <button class="filter" data-filter="done">已完成</button>
    </div>
    <button class="add" id="addCategory">＋ 新增分類</button>
  </div>
  <section class="grid" id="board"></section>
  <div class="footer"><span>你的清單會自動保存在這台裝置的瀏覽器中。</span><button class="reset" id="reset">重設為初始清單</button></div>
</main>
<script>
const starter = [
 {title:"旅行與探索",en:"TRAVEL & DISCOVERY",items:["安排一趟國內小旅行","去一個從沒去過的城市","看一次日出或日落","走訪一條新的步道","安排一次海外旅行"]},
 {title:"學習與成長",en:"LEARNING",items:["完成一門線上課程","讀完 6 本書","練習英文口說並留下紀錄","學會一項新技能","參加一場講座或展覽"]},
 {title:"健康與生活",en:"WELLNESS",items:["建立固定運動習慣","嘗試一種新的運動","維持規律作息一個月","學做 5 道新料理","安排一次身心放鬆日"]},
 {title:"財務與工作",en:"MONEY & CAREER",items:["完成年度財務盤點","設定並追蹤年度存款目標","學習一項工作相關技能","整理履歷與職涯方向","建立自己的投資紀錄"]},
 {title:"關係與日常",en:"PEOPLE & EVERYDAY",items:["和重要的人安排一趟旅行","主動聯絡一位老朋友","安排一次有儀式感的約會","拍一組生活紀錄照片","留一天給自己，不排任何行程"]},
 {title:"小小冒險",en:"LITTLE ADVENTURES",items:["體驗手作課程","看一場現場表演","去一次露營或住特色民宿","嘗試一家口袋名單餐廳","完成一件拖延很久的小事"]}
];
const KEY="year2027-checklist-v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY))||starter.map(x=>({...x,items:x.items.map(t=>({text:t,done:false}))}));}catch(e){data=starter.map(x=>({...x,items:x.items.map(t=>({text:t,done:false}))}));}
let filter="all";
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function totals(){let all=data.flatMap(c=>c.items),done=all.filter(i=>i.done).length;return {all:all.length,done};}
function render(){
 const t=totals(),p=t.all?Math.round(t.done/t.all*100):0;
 document.getElementById("doneCount").textContent=t.done;
 document.getElementById("progress").style.width=p+"%";
 document.getElementById("percent").textContent=p+"%";
 const board=document.getElementById("board");board.innerHTML="";
 let shown=0;
 data.forEach((cat,ci)=>{
   const items=cat.items.map((item,ii)=>({...item,ii})).filter(i=>filter==="all"||(filter==="done"&&i.done)||(filter==="open"&&!i.done));
   if(!items.length && filter!=="all")return;
   shown++;
   const card=document.createElement("article");card.className="category";
   const head=document.createElement("div");head.className="cat-head";
   const title=document.createElement("div");title.innerHTML=`<span class="cat-title"></span><span class="cat-en"></span>`;
   title.querySelector(".cat-title").textContent=cat.title;title.querySelector(".cat-en").textContent=cat.en||"";
   const count=document.createElement("span");count.className="cat-count";count.textContent=cat.items.filter(i=>i.done).length+" / "+cat.items.length;
   head.append(title,count);card.append(head);
   const list=document.createElement("div");list.className="items";
   items.forEach(item=>{
     const row=document.createElement("label");row.className="item"+(item.done?" done":"");
     const cb=document.createElement("input");cb.type="checkbox";cb.checked=item.done;
     cb.addEventListener("change",()=>{data[ci].items[item.ii].done=cb.checked;save();});
     const txt=document.createElement("span");txt.className="item-text";txt.textContent=item.text;
     const del=document.createElement("button");del.className="delete";del.type="button";del.textContent="×";del.title="刪除此項目";
     del.addEventListener("click",e=>{e.preventDefault();if(confirm("確定刪除這個項目？")){data[ci].items.splice(item.ii,1);save();}});
     row.append(cb,txt,del);list.append(row);
   });
   card.append(list);
   if(filter==="all"){
     const form=document.createElement("form");form.className="add-row";
     const input=document.createElement("input");input.placeholder="新增一件想做的事…";input.maxLength=90;
     const btn=document.createElement("button");btn.textContent="加入";
     form.addEventListener("submit",e=>{e.preventDefault();let v=input.value.trim();if(v){data[ci].items.push({text:v,done:false});save();}});
     form.append(input,btn);card.append(form);
   }
   board.append(card);
 });
 if(!shown){const e=document.createElement("div");e.className="empty";e.textContent="目前沒有符合條件的項目。";board.append(e);}
}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render();});
document.getElementById("addCategory").addEventListener("click",()=>{const name=prompt("想新增什麼分類？");if(name&&name.trim()){data.push({title:name.trim(),en:"",items:[]});save();}});
document.getElementById("reset").addEventListener("click",()=>{if(confirm("這會刪除目前所有修改，恢復初始清單。確定嗎？")){data=starter.map(x=>({...x,items:x.items.map(t=>({text:t,done:false}))}));save();}});
render();
</script>
</body>
</html>
